name: Build GLCD Utils

on:
  workflow_dispatch: # Lets you trigger the build manually from the Actions tab
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt 5 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential qtbase5-dev qt5-qmake

      - name: Build with QMake
        run: |
          mkdir build && cd build
          qmake ../GLCD_Utils.pro
          make -j$(nproc)

      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: glcd-utils-linux
          path: build/GLCD_Utils
